[project]
name = "doyra-ai"
version = "0.1.0"
description = "Doyra AI Phase A note classifier"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "librosa",
    "joblib",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
doyra-train = "doyra_ai.train:main"
doyra-infer = "doyra_ai.infer:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
